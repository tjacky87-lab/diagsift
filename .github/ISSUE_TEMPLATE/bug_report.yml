name: Bug report
description: Report a reproducible DiagSift defect without attaching private diagnostic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real bundles, credentials, production logs, personal paths, private hosts, or account data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the result without copying sensitive diagnostic content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DiagSift version
      placeholder: v0.1.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use a minimal manifest and synthetic data only.
    validations:
      required: true
