name: Build local release-candidate artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string for candidate binaries (for example v0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate candidate version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'version must be a simple semantic version such as v0.1.0-rc.1'
          }

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build candidate
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $suffix = if ('${{ matrix.goos }}' -eq 'windows') { '.exe' } else { '' }
          $name = 'diagsift-' + $env:VERSION + '-${{ matrix.goos }}-${{ matrix.goarch }}' + $suffix
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = '${{ matrix.goos }}'
          $env:GOARCH = '${{ matrix.goarch }}'
          $flags = '-s -w -X github.com/tjacky87-lab/diagsift/internal/app.Version=' + $env:VERSION
          go build -trimpath -ldflags $flags -o (Join-Path dist $name) ./cmd/diagsift
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagsift-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  metadata:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: diagsift-${{ inputs.version }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagsift-sbom
          path: diagsift-${{ inputs.version }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  checksums-and-provenance:
    needs: [build, metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: candidate
          merge-multiple: true
      - name: Create checksums
        working-directory: candidate
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagsift-${{ inputs.version }}-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 14

# This workflow only creates short-lived Actions artifacts. It does not create a
# GitHub Release, publish a package, or push a tag. Maintainer approval is required.
